services:
  attendance-app:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - path: .env
        format: raw
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - CLOUD_DB_PATH=/data/cloud_attendance.db
    volumes:
      - ./cloud_data:/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge
